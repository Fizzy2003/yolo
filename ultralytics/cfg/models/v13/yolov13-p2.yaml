# Ultralytics YOLOv13 (small-object enhanced) with P2/4 - P5/32 outputs

# Parameters
nc: 80  # number of classes
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]   # Nano
  s: [0.50, 0.50, 1024]   # Small
  l: [1.00, 1.00, 512]    # Large
  x: [1.00, 1.50, 512]    # Extra Large

# YOLOv13 backbone (remove early dilations; add SPPF)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,   [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv,   [128, 3, 2]]     # 1-P2/4   (no dilation; keep details)
  - [-1, 2, DSC3k2, [256, False, 0.25]]
  - [-1, 1, Conv,   [256, 3, 2]]     # 3-P3/8   (no dilation)
  - [-1, 2, DSC3k2, [512, False, 0.25]]
  - [-1, 1, DSConv, [512, 3, 2]]     # 5-P4/16
  - [-1, 4, A2C2f,  [512, True, 4]]
  - [-1, 1, DSConv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 4, A2C2f,  [1024, True, 1]] # 8
  - [-1, 1, SPPF,   [1024, 5]]       # 9 - global context

# YOLOv13-p2 head (FPN + PAN with P2 branch)
head:
  # top-down: P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11, cat backbone P4
  - [-1, 2, DSC3k2, [512, True]]                 # 12

  # top-down: P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14, cat backbone P3
  - [-1, 2, DSC3k2, [256, True]]                 # 15 (P3/8)

  # top-down: P3 -> P2  (new for small-object)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 2], 1, Concat, [1]]                    # 17, cat backbone P2
  - [-1, 2, DSC3k2, [128, True]]                 # 18 (P2/4)

  # bottom-up: P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]                   # 19
  - [[-1, 15], 1, Concat, [1]]                   # 20
  - [-1, 2, DSC3k2, [256, True]]                 # 21 (P3/8 refined)

  # bottom-up: P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                   # 22
  - [[-1, 12], 1, Concat, [1]]                   # 23
  - [-1, 2, DSC3k2, [512, True]]                 # 24 (P4/16 refined)

  # bottom-up: P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                   # 25
  - [[-1, 9], 1, Concat, [1]]                    # 26, cat SPPF
  - [-1, 2, DSC3k2, [1024, True]]                # 27 (P5/32 refined)

  # Detect heads on P2, P3, P4, P5
  - [[18, 21, 24, 27], 1, Detect, [nc]]  # Detect(P2, P3, P4, P5)